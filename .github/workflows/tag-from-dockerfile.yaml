---
name: tag-from-dockerfile

on:
  push:
    branches: [main]
    paths: [Dockerfile]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      # https://github.com/marketplace/actions/github-app-token
      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: "${{ secrets.BOT_APP_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"

      # https://github.com/marketplace/actions/checkout
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: "${{ steps.app-token.outputs.token }}"

      - name: Extract tag from FROM line
        run: |
          TAG=$(sed -n 's/^FROM docker\.io\/nousresearch\/hermes-agent:\(v[^@]*\).*/\1/p' Dockerfile)
          echo "tag=$TAG" >> "$GITHUB_ENV"

      # https://github.com/marketplace/actions/github-tag
      - name: GitHub Tag
        if: env.tag != ''
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7.0.0
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          tag_prefix: ""
          custom_tag: ${{ env.tag }}
